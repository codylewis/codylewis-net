[build]
publish = "public"
command = "hugo --gc --minify"

[build.environment]
HUGO_VERSION = "0.168.0"
HUGO_ENV = "production"
NODE_VERSION = "22"

[context.deploy-preview]
command = "hugo --gc --minify --buildFuture -b $DEPLOY_PRIME_URL"

[context.branch-deploy]
command = "hugo --gc --minify -b $DEPLOY_PRIME_URL"

# The syntax tree app moved to its own subdomain (GitHub Pages)
[[redirects]]
from = "/apps/syntax-tree-generator/*"
to = "https://syntaxtree.codylewis.net/"
status = 301
force = true
