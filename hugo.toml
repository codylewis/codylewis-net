baseURL = "https://codylewis.net/"
title = "Cody Lewis"
theme = "PaperMod"
copyright = "© Cody Lewis"

enableEmoji = true
enableRobotsTXT = true
summaryLength = 30

# The blog is archived: posts keep their /posts/... URLs and stay in the
# sitemap so search results still resolve, but nothing links to them.

# English stays at the root so existing URLs don't change; Irish is at /ga/.
defaultContentLanguage = "en"

[markup.goldmark.renderer]
  # Older posts embed CodePen with raw HTML
  unsafe = true

[params]
  defaultTheme = "auto"
  displayFullLangName = true
  goatcounter = "cody"
  images = ["img/og-en.jpg"]

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/codylewis"

  [[params.socialIcons]]
    name = "linkedin"
    url = "https://www.linkedin.com/in/codyslewis"

[languages.en]
  languageName = "English"
  locale = "en-us"
  weight = 1

  [languages.en.params]
    description = "🇮🇪 Gaeilgeoir 🎤 Speaker 🎭 Improv"

    [languages.en.params.profileMode]
      enabled = true
      greeting = "Haigh a chairde, mise Cody!"
      title = "Cody Lewis"
      pronouns = "they/them"
      subtitle = "🇮🇪 Gaeilgeoir 🎤 Speaker 🎭 Improv"
      bio = "I'm a Senior Software Engineer at [Connective Consulting](https://www.connectiveconsulting.com/) finishing up my Bachelor's Degree in [Linguistics at UW-Milwaukee](https://uwm.edu/linguistics/)."
      invite = "Má tá Gaeilge agat, [seol teachtaireacht chugam](https://www.linkedin.com/in/codyslewis), déanaimis comhrá!"
      imageUrl = "/img/profile.jpg"
      imageWidth = 160
      imageHeight = 160
      imageTitle = "Cody Lewis"

      [[languages.en.params.profileMode.buttons]]
        name = "Syntax Tree Generator"
        url = "https://syntaxtree.codylewis.net/"

[languages.ga]
  languageName = "Gaeilge"
  locale = "ga"
  weight = 2

  [languages.ga.params]
    description = "🇮🇪 Gaeilgeoir 🎤 Cainteoir 🎭 Tobchumadh"
    images = ["img/og-ga.jpg"]

    [languages.ga.params.profileMode]
      enabled = true
      greeting = "Haigh a chairde, mise Cody!"
      title = "Cody Lewis"
      pronouns = "siad/iad"
      subtitle = "🇮🇪 Gaeilgeoir 🎤 Cainteoir 🎭 Tobchumadh"
      bio = "Is Innealtóir Bogearraí Sinsearach mé ag [Connective Consulting](https://www.connectiveconsulting.com/), agus mo chéim bhaitsiléara sa Teangeolaíocht á críochnú agam in [UW-Milwaukee](https://uwm.edu/linguistics/)."
      invite = "Má tá Gaeilge agat, [seol teachtaireacht chugam](https://www.linkedin.com/in/codyslewis), déanaimis comhrá!"
      imageUrl = "/img/profile.jpg"
      imageWidth = 160
      imageHeight = 160
      imageTitle = "Cody Lewis"

      [[languages.ga.params.profileMode.buttons]]
        name = "Gineadóir Crann Comhréire"
        url = "https://syntaxtree.codylewis.net/"
